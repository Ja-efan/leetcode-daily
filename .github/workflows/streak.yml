name: Update streak

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/readme/streak.svg"
  schedule:
    # 매일 23:50 KST (14:50 UTC): 오늘 못 푼 날에도 칸이 갱신되도록
    - cron: "50 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: true

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 스트릭 계산에 전체 커밋 기록이 필요하다

      - name: Render streak.svg
        run: |
          python3 scripts/streak.py > "$RUNNER_TEMP/streak.json"
          python3 scripts/render_streak_svg.py assets/readme/streak.svg < "$RUNNER_TEMP/streak.json"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/readme/streak.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/streak.svg
          # chore: 접두어 — streak.py 는 solved: 커밋만 세므로 계산에 영향이 없다
          git commit -m "chore: update streak"
          git push
